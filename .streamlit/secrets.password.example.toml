# Streamlit Cloud의 Secrets에서 실제 값으로 교체하세요.
[storage]
mode = "postgres"
[database]
# Render PostgreSQL의 External Database URL (Internal URL 아님)
url = "postgresql://USER:PASSWORD@EXTERNAL-HOST:5432/DB"
[login]
method = "password"
[local_auth.users.admin]
# create_login.py로 생성한 해시만 입력합니다. 평문 비밀번호가 아닙니다.
password_hash = "REPLACE_WITH_GENERATED_HASH"
role = "editor"
[local_excel]
source_id = "local-excel"
