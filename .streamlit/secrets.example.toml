# 실제 값은 Streamlit Cloud의 Secrets에 입력하세요. secrets.toml은 Git에 올리지 않습니다.
[storage]
mode = "postgres"
[database]
url = "postgresql+psycopg://USER:PASSWORD@HOST:5432/DB"
[auth]
redirect_uri = "https://YOUR-APP.streamlit.app/oauth2callback"
cookie_secret = "REPLACE_WITH_A_LONG_RANDOM_SECRET"
client_id = "YOUR_OIDC_CLIENT_ID"
client_secret = "YOUR_OIDC_CLIENT_SECRET"
server_metadata_url = "https://login.microsoftonline.com/YOUR-TENANT-ID/v2.0/.well-known/openid-configuration"
[access]
allowed_emails = ["editor@example.com", "viewer@example.com"]
editor_emails = ["editor@example.com"]

[local_excel]
source_id = "local-excel"
